# Include inside the HTTPS server block for lucent-solutions.tech and www.
# HTML must revalidate so browsers discover the current hashed JS/CSS assets.
location = / {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files /index.html =404;
}

location ~* \.html$ {
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    try_files $uri =404;
}

location = /BUILD_INFO.txt {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}
